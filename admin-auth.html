<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Authentication - Fast Food Billing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/a2d9b4f6d4.js" crossorigin="anonymous"></script>
</head>
<body data-page="admin-auth">
  <button class="settings-btn" id="settingsBtn" title="Settings" style="position:fixed;top:20px;right:20px;z-index:1000"><i class="fas fa-cog"></i></button>
  
  <!-- Settings Modal -->
  <div class="settings-modal" id="settingsModal">
    <div class="settings-panel">
      <div class="settings-header">
        <h3>Settings</h3>
        <button class="settings-close" id="settingsClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="settings-content">
        <div class="settings-section">
          <h4>Theme</h4>
          <div class="theme-toggle-container">
            <label for="checkbox-admin-auth">Dark Mode</label>
            <label class="theme-switch" for="checkbox-admin-auth">
              <input type="checkbox" id="checkbox-admin-auth" class="checkbox-input" />
              <div class="slider round"></div>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="auth-wrapper">
    <div class="auth-card glass">
      <h2>Admin Access</h2>
      <div class="tabs">
        <button class="tab active" data-tab="signin">Sign In</button>
        <button class="tab" data-tab="signup">Sign Up</button>
      </div>

      <form id="adminSigninForm" class="form active">
        <div class="input-group"><label>Username or Email</label><input id="adminSignUser" type="text" required></div>
        <div class="input-group password"><label>Password</label><input id="adminSignPass" type="password" required><button type="button" class="show-pass"><i class="fas fa-eye"></i></button></div>
        <div class="form-actions"><button type="submit" class="btn primary ripple">Sign In</button><a href="index.html" class="btn link">Back</a></div>
      </form>

      <form id="adminSignupForm" class="form">
        <div class="input-grid">
          <div class="input-group"><label>Name</label><input id="adName" type="text" required></div>
          <div class="input-group"><label>Email</label><input id="adEmail" type="email" required></div>
          <div class="input-group"><label>Special Code</label><input id="adCode" type="text" required placeholder="Enter admin code"></div>
          <div class="input-group"><label>Username</label><input id="adUser" type="text" required></div>
          <div class="input-group password"><label>Password</label><input id="adPass" type="password" required><button type="button" class="show-pass"><i class="fas fa-eye"></i></button></div>
          <div class="input-group password"><label>Confirm Password</label><input id="adPass2" type="password" required><button type="button" class="show-pass"><i class="fas fa-eye"></i></button></div>
        </div>
        <div class="form-actions"><button type="submit" class="btn primary ripple">Register Admin</button><a href="index.html" class="btn link">Cancel</a></div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
